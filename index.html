<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bir Sorum Var</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            font-family: Arial, sans-serif;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #yesBtn {
            background-color: #4CAF50;
            color: white;
            margin-right: 20px;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
        }

        footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.6);
            user-select: none;
        }
    </style>
</head>
<body>

<div class="box">
    <h2 id="question">Benimle çıkar mısın? 💖</h2>
    <button id="yesBtn">Evet</button>
    <button id="noBtn">Hayır</button>
</div>
<div id="consentModal" style="
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
">
    <div style="
        background:white;
        padding:20px;
        border-radius:12px;
        max-width:400px;
        text-align:center;
        font-size:14px;
    ">
        <p>
            <strong>Yasal Uyarı</strong><br><br>
            Bu butona basarak, WhatsApp üzerinden
            tarafınıza mesaj gönderilmesini
            <strong>açık rızanızla</strong> kabul etmiş olursunuz.
        </p>

        <label style="display:block; margin:15px 0;">
            <input type="checkbox" id="consentCheck">
            Okudum, kabul ediyorum
        </label>

        <button id="consentBtn"
            style="padding:8px 16px; border:none; border-radius:8px; background:#4CAF50; color:white; cursor:pointer;">
            Kabul Ediyorum
        </button>
    </div>
</div>

<footer>
    © Ömer Büke
</footer>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const question = document.getElementById("question");

    let noCount = 0;

    const noTexts = [
        "Emin misin? 🤨",
        "Bir daha düşün bence 😅",
        "Kalbim kırılıyor ama... 💔",
        "Bu kadar mı ya 😢",
        "Tamam ama son kez soruyorum 😐"
    ];

    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);

        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

        question.textContent = noTexts[noCount];
        noCount++;

        if (noCount >= noTexts.length) {
            noCount = 0;
        }
    });

    <script>
const phone = "905387149405"; // başında 0 YOK

yesBtn.addEventListener("click", () => {
    document.getElementById("consentModal").style.display = "flex";
});

document.getElementById("consentBtn").addEventListener("click", () => {
    const check = document.getElementById("consentCheck");

    if (!check.checked) {
        alert("Devam etmek için onay vermelisin.");
        return;
    }

    const message = encodeURIComponent("Kabul edildi");

    window.open(`https://wa.me/${phone}?text=${message}`, "_blank");

    question.textContent = "Kabul edildi 💖";
    noBtn.style.display = "none";
    yesBtn.style.display = "none";
    document.getElementById("consentModal").style.display = "none";
});

</script>

</body>
</html>
